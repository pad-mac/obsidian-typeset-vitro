name: Release

# Builds and publishes a GitHub release (main.js, manifest.json, styles.css) for BRAT
# whenever a push to main carries a manifest.json version that has no release yet.
# Bump "version" in manifest.json (+ versions.json) to ship a new release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found == 'false'
        run: npm ci && npm run build
      - if: steps.exists.outputs.found == 'false'
        name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.version }}" --generate-notes
